name: Auto Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY_IDS }}
          port: 65002
          script: |
            REPO=/home/u221026474/ids-repo
            TARGET=/home/u221026474/domains/intellectworksdigital.com/public_html

            if [ ! -d "$REPO/.git" ]; then
              git clone https://github.com/VELRK/ids.git $REPO
            else
              cd $REPO && git pull origin main
            fi

            rsync -a --delete --exclude='default_old.php' $REPO/out/ $TARGET/
